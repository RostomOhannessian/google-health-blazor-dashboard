name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Least privilege: CI only reads the repository. Any job needing more must opt in.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./HealthMetrics.slnx

      - name: Build
        run: dotnet build ./HealthMetrics.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./HealthMetrics.slnx --configuration Release --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload code coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ matrix.os }}
          path: coverage/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

      # This repo pins SQLitePCLRaw and System.Security.Cryptography.Xml to escape
      # known advisories. Fail the build if a new advisory appears (or a pin is
      # dropped) instead of finding out by hand. `dotnet list` exits 0 either way,
      # so the output has to be inspected.
      - name: Scan for vulnerable dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet list ./HealthMetrics.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
          echo "No vulnerable packages detected."

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
