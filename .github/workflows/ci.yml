name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./HealthMetrics.slnx

      - name: Build
        run: dotnet build ./HealthMetrics.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./HealthMetrics.slnx --configuration Release --no-build --verbosity minimal
